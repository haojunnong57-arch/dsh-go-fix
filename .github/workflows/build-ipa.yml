name: 编译 dsh-Go 未签名 IPA（含本机引擎 + 手机操控）

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 220
    env:
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - uses: actions/checkout@v4

      - name: select xcode
        run: |
          sw_vers
          if [ ! -d /Applications/Xcode_26.6.app ]; then
            pick="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
            echo "DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          else
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          /usr/bin/xcodebuild -version || true

      - name: flutter
        run: |
          set -eux
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -x 'flutter/bin/cache/artifacts/engine/android-*/*' -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: rust
        run: |
          set -eux
          if ! command -v cargo >/dev/null; then
            curl -fsSL https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
            sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version

      - name: ish tools
        run: |
          set -euxo pipefail
          brew install llvm lld
          python3 -m venv "$RUNNER_TEMP/ish-tools"
          "$RUNNER_TEMP/ish-tools/bin/pip" install -q meson==1.7.2 ninja==1.11.1.4
          echo "$RUNNER_TEMP/ish-tools/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          PATH="$(brew --prefix lld)/bin:$PATH" ld.lld --version

      - name: prepare engine
        run: |
          set -eux
          python3 --version
          bash tooling/ios/prepare-engine.sh
          ls app/ios/Engine | head -20

      - name: phone self runner native
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:$PATH"
          bash tooling/ios/build-phone-self-runner.sh
          ls app/ios/PhoneSelfRunnerNative/PhoneSelfRunner.xcconfig
          grep -c . app/ios/PhoneSelfRunnerNative/PhoneSelfRunner.xcconfig

      - name: deps
        run: |
          set -eux
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app
          flutter pub get --enforce-lockfile
          flutter gen-l10n

      - name: build device unsigned
        working-directory: app
        run: |
          set -eux
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.cargo/bin:$PATH"
          bash ../tooling/ios/build.sh --release --no-codesign

      - name: verify and package
        run: |
          set -eux
          APP=app/build/ios/iphoneos/Runner.app
          test -d "$APP"
          ls "$APP/Frameworks"
          for n in NodeMobile DshNodeHost DshFlock DshRequireBuiltin DshGuest DshGuestBridge; do
            test -e "$APP/Frameworks/$n.framework/$n" || echo "::warning::$n.framework missing"
          done
          strings "$APP/Runner" | grep -Fq 'dsh-phone-core:1' && echo "phone runner linked" || echo "::warning::phone runner identity not found"
          test -d "$APP/PhoneSelfRunnerNotices" && ls "$APP/PhoneSelfRunnerNotices" || echo "::warning::phone notices missing"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/dsh-Go-1.3.0-ios-unsigned.ipa")
          cp "$RUNNER_TEMP/dsh-Go-1.3.0-ios-unsigned.ipa" ./dsh-Go-1.3.0-ios-unsigned.ipa
          ls -lh dsh-Go-1.3.0-ios-unsigned.ipa

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-unsigned
          path: dsh-Go-1.3.0-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-pairing-fix
          name: dsh-Go 1.3.0 iOS 27 pairing fix (unsigned IPA)
          body: 'unsigned IPA: sideload with Sideloadly / AltStore / ESign'
          files: dsh-Go-1.3.0-ios-unsigned.ipa
          fail_on_unmatched_files: true

      - name: keep build log on failure
        if: failure()
        run: |
          find . -name '*.log' -newermt '-2 hours' | head -5 | while read -r f; do echo "=== $f ==="; tail -n 40 "$f"; done
