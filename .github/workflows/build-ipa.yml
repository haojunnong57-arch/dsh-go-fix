name: iOS 未签名 IPA（含配对凭据导入修复）

# 用 GitHub 的 macOS runner 把 dsh-Go 编成未签名 IPA。
# 上游工程用 Swift Package Manager（无 Podfile），需要 Flutter 3.47.7 + Xcode 26。

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          xcodebuild -version
          sw_vers
          df -h /

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install build tooling
        run: |
          brew install llvm lld meson ninja python@3.12 || true
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH
          python3 --version
          meson --version
          ninja --version

      - name: Prepare on-device engine
        env:
          PYTHON: python3
        run: |
          tooling/ios/prepare-engine.sh
        continue-on-error: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build unsigned iOS app
        working-directory: app
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -eux
          APP=app/build/ios/iphoneos/Runner.app
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry dsh-Go-1.3.0-ios-unsigned.ipa Payload
          ls -lh dsh-Go-1.3.0-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-unsigned
          path: build/dsh-Go-1.3.0-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
